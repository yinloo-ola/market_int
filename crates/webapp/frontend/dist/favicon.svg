<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MarketInt favicon: a falling price caught at the strike floor --
       (the put-selling thesis). Tile uses the app's --accent blue; glyph
       strokes overlap by design so no hairline gap shows at 16px. -->
  <rect width="64" height="64" rx="15" fill="#0d5cd7"/>
  <line x1="16" y1="49" x2="48" y2="49" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="20" y1="14" x2="40" y2="44" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
</svg>
