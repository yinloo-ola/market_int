[package]
name = "market_int_webapp"
version.workspace = true
edition.workspace = true

# Empty-for-now member (ticket 11): the axum server lands in ticket 15.
# Depends ONLY on core, so Telegram publishing code can never be linked in.

[[bin]]
name = "market_int_webapp"
path = "src/main.rs"

[features]
default = []
bundled-sqlite = ["market_int_core/bundled-sqlite"]

[dependencies]
market_int_core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tokio.workspace = true
log.workspace = true
dotenv.workspace = true
env_logger.workspace = true
axum = "0.8"
# Firebase ID-token verification (ticket 06 resolution): RS256 + Google JWKS
# with Cache-Control-driven auto-refresh; needs only the public project id.
# default-features off drops actix-web; "openssl" = reqwest/default-tls, which
# matches the workspace reqwest native-tls build (no openssl-sys on macOS).
firebase-auth = { version = "0.5.1", default-features = false, features = ["axum", "openssl"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
