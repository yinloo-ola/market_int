# market-int-web Service manifest.
# NOTE: keep comments on their OWN lines — gcloud's yaml→proto converter
# glues trailing comments onto numeric values (timeoutSeconds: 900 # ... is
# a parse error).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: market-int-web
  # second artifact; the scheduled Job (market-int) stays untouched
spec:
  template:
    metadata:
      annotations:
        # single writer for the shared GCS artifacts (last_run.json atomic
        # write, grant-file rewrites) — SQLite itself now runs on /tmp
        autoscaling.knative.dev/maxScale: "1"
        # required by the GCS FUSE CSI volume
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: 628240778300-compute@developer.gserviceaccount.com
      # keep >1: view endpoints share the instance with the minutes-long run request
      containerConcurrency: 80
      # default 300 would 504 a slow run; max 3600 — NOTE: spec-level field
      # (container-level timeoutSeconds breaks `gcloud run services replace`)
      timeoutSeconds: 900
      containers:
        - name: webapp
          # bumped by make docker-build
          image: us-west1-docker.pkg.dev/opt-intel/docker-repo/market-int:0.15.1
          # Service overrides command; the Job keeps the CLI binary
          command: ["/market_int/market_int_webapp"]
          ports:
            # plain HTTP/1.1: axum::serve currently speaks HTTP/1.1 only — a
            # named h2c port makes Cloud Run speak h2c and every request 503s.
            # (Revisit with axum http2 enabled to restore SSE cancel-on-close.)
            - containerPort: 8080
          env:
            # container-local in-memory disk: pipeline scratch (quotes/metrics/
            # chains) written+read within one run, discarded with the instance —
            # same rationale as the Job. Views only read last_run.json; the GCS
            # volume keeps the durable artifacts (symbols.csv, last_run.json,
            # allowed_emails.txt).
            - name: sqlite_file
              value: /tmp/data.db
            - name: webapp_symbols_file
              value: /data/symbols.csv
            - name: webapp_result_file
              value: /data/webapp/last_run.json
            # public value (t06) — not a secret
            - name: FIREBASE_PROJECT_ID
              value: market-int-1e5e4
            # owners: may use the API and manage the grant list
            - name: WEBAPP_OWNER_EMAILS
              value: "tianhai@gmail.com"
            # live grants: edit /data/allowed_emails.txt on the GCS volume — no redeploy
            - name: WEBAPP_ALLOWED_EMAILS_FILE
              value: /data/allowed_emails.txt
            - name: RUST_LOG
              value: info
            - name: marketdata_token
              valueFrom:
                secretKeyRef: { key: latest, name: marketdata_token }
            # Tiger creds: repo job.yaml omits them, but perform-all hard-requires them.
            # Create tiger_id/tiger_rsa in Secret Manager (the live Job injects them
            # out-of-band) and grant the SA roles/secretmanager.secretAccessor — see §7.3.
            - name: TIGER_ID
              valueFrom:
                secretKeyRef: { key: latest, name: tiger_id }
            - name: TIGER_RSA
              valueFrom:
                secretKeyRef: { key: latest, name: tiger_rsa }
          resources:
            limits:
              cpu: 1000m
              # matches the Job; bump to 1Gi if view traffic during runs shows pressure
              memory: 512Mi
          volumeMounts:
            - name: gcs-1
              mountPath: /data
      volumes:
        - name: gcs-1
          csi:
            # same CSI driver as the Job
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: opt-intel
